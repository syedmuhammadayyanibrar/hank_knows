name: Eval and Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test

      - name: Run evaluation harness with baseline gate
        run: node eval/run.js --check-baseline

      - name: Verify README report matches evaluation output
        run: |
          node eval/report.js
          git diff --exit-code README.md
